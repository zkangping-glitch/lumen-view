name: Viewer and editor checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libxkbcommon-x11-0
      - run: python -m pip install -e . -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python tools/ui_test.py
      - run: python tools/selftest.py

  build-installer:
    name: Build Windows installer
    needs: test
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -e . -r requirements.txt "pyinstaller>=6.16,<7"
      - name: Build icon and standalone application
        run: |
          python tools/make_icon.py
          pyinstaller --noconfirm --clean packaging/LumenView.spec
      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\LumenView\LumenView.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw "Packaged application did not finish its smoke test"
          }
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          & $compiler "packaging\LumenView.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "dist\LumenView\*" -DestinationPath "dist\LumenView-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: LumenView-Windows
          if-no-files-found: error
          path: |
            dist/installer/LumenView-Setup.exe
            dist/LumenView-portable.zip
